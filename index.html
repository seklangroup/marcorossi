
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Marco Rossi | Elite Real Estate</title>
    <style>
        :root { --gold: #b8860b; --dark: #1a1a1a; --light: #f4f4f4; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--light); display: flex; height: 100vh; }
        #sidebar { width: 350px; background: var(--dark); color: white; display: flex; flex-direction: column; }
        .header { padding: 20px; border-bottom: 1px solid #333; text-align: center; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 10px; max-width: 80%; font-size: 14px; }
        .msg.ai { background: #333; align-self: flex-start; }
        .msg.user { background: var(--gold); align-self: flex-end; }
        .input-area { padding: 20px; display: flex; gap: 10px; background: #111; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: none; outline: none; }
        button { background: var(--gold); border: none; color: white; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 5px; }
        #main { flex: 1; padding: 40px; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; border: 1px solid #ddd; border-radius: 15px; overflow: hidden; transition: 0.3s; cursor: pointer; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card-img { height: 180px; background: #ccc; position: relative; }
        .price { position: absolute; bottom: 10px; left: 10px; background: var(--gold); color: white; padding: 5px 10px; font-weight: bold; border-radius: 5px; }
        .card-body { padding: 20px; }
        .card-title { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .card-meta { color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="header">
            <h2>Marco Rossi</h2>
            <small>Consultor Elite</small>
        </div>
        <div id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Fale com o Marco...">
            <button onclick="send()">></button>
        </div>
    </div>
    <div id="main">
        <h1>Catálogo de Luxo</h1>
        <div class="grid" id="grid"></div>
    </div>

    <script>
        const API_URL = "http://localhost:8000";
        const PHONE = "+351968382941"; // Mock phone

        async function loadProperties() {
            const res = await fetch(`${API_URL}/properties`);
            const data = await res.json();
            const grid = document.getElementById('grid');
            data.forEach(p => {
                grid.innerHTML += `
                    <div class="card" onclick="askAbout('${p.title}')">
                        <div class="card-img"><div class="price">€ ${p.price_eur.toLocaleString()}</div></div>
                        <div class="card-body">
                            <div class="card-title">${p.title}</div>
                            <div class="card-meta">${p.location} | ${p.meta}</div>
                        </div>
                    </div>
                `;
            });
        }

        async function send() {
            const input = document.getElementById('user-input');
            const text = input.value;
            if(!text) return;
            
            addMsg(text, 'user');
            input.value = '';

            const res = await fetch(`${API_URL}/chat`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ text, phone: PHONE })
            });
            const data = await res.json();
            addMsg(data.response, 'ai');
        }

        function askAbout(title) {
            document.getElementById('user-input').value = `Quero saber mais sobre ${title}`;
            send();
        }

        function addMsg(text, sender) {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div class="msg ${sender}">${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        loadProperties();
    </script>
</body>
</html>
